    <script>
      // Apply a saved light/dark choice before first paint, so there is no flash.
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
